<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2A36">
  <title>英語音読</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- ホーム画面に追加したときの設定（PWA） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="英語音読">
</head>
<body>

  <main class="page page-list">

    <h1 class="app-title">英語音読</h1>

    <!-- この端末に取り込んだ教材 -->
    <h2 class="list-heading">教材</h2>
    <ul id="imported-list" class="lesson-list"></ul>
    <div id="imported-empty" class="empty-card" hidden>
      <p class="empty-text">まだ教材がありません。JSONと音声ファイルを取り込むと、ここに表示されます。</p>
      <a href="manage.html" class="empty-btn">教材を取り込む</a>
    </div>

    <!-- PCで確認するときだけ表示（private/lessons.json に書いたもの） -->
    <section id="dev-section" hidden>
      <h2 class="list-heading">PCの教材（private）</h2>
      <ul id="private-list" class="lesson-list"></ul>
      <p id="private-note" class="list-note" hidden></p>
    </section>

    <!-- サンプル教材 -->
    <h2 class="list-heading">サンプル</h2>
    <ul id="sample-list" class="lesson-list"></ul>

    <!-- 教材の管理へ -->
    <p class="manage-link-wrap">
      <a href="manage.html" class="manage-link">教材の管理（取り込み・削除）</a>
    </p>

  </main>

  <!-- 読み込む順番が大事：progress → db → list -->
  <script src="js/progress.js"></script>
  <script src="js/db.js"></script>
  <script src="js/list.js"></script>

  <!-- オフラインでも起動できるようにする（公開したサイトでだけ動かす） -->
  <script>
    if ("serviceWorker" in navigator &&
        location.hostname !== "127.0.0.1" &&
        location.hostname !== "localhost") {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
