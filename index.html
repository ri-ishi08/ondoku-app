<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2A36">
  <title>英語音読</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- ホーム画面に追加したときの設定（PWA） -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="英語音読">
</head>
<body>

  <main class="page page-list">

    <h1 class="app-title">英語音読</h1>

    <!-- 総カウントと今日のカウント -->
    <section class="stats" aria-label="勉強記録">
      <div class="stat">
        <p class="stat-label">総カウント</p>
        <p class="stat-value"><span id="total-count">0</span><span class="stat-unit">回</span></p>
      </div>
      <div class="stat">
        <p class="stat-label">今日</p>
        <p class="stat-value"><span id="today-count">0</span><span class="stat-unit">回</span></p>
      </div>
    </section>

    <!-- 自分の教材（private/lessons.json に書いたもの） -->
    <h2 class="list-heading">教材</h2>
    <ul id="private-list" class="lesson-list"></ul>
    <p id="private-note" class="list-note" hidden></p>

    <!-- サンプル教材 -->
    <h2 class="list-heading">サンプル</h2>
    <ul id="sample-list" class="lesson-list"></ul>

  </main>

  <!-- 読み込む順番が大事：progress → list -->
  <script src="js/progress.js"></script>
  <script src="js/list.js"></script>

  <!-- オフラインでも起動できるようにする（公開したサイトでだけ動かす） -->
  <script>
    if ("serviceWorker" in navigator &&
        location.hostname !== "127.0.0.1" &&
        location.hostname !== "localhost") {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
